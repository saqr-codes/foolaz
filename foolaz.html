<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>فولاذ — مدرب صقر الشخصي</title>

  <!-- Mobile Web App / Home Screen Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="فولاذ" />
  <meta name="theme-color" content="#060f0b" />

  <!-- Arabic Google Font: Cairo & Tajawal -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800;900&family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Cairo', 'Tajawal', 'Segoe UI', 'Tahoma', 'Arial', 'sans-serif'],
          },
          colors: {
            bgDeep: '#060f0b',
            bgCard: '#0c1c15',
            bgCardLight: '#12291f',
            emeraldPri: '#10b981',
            emeraldBright: '#34d399',
            limeSpark: '#a3e635',
            mintText: '#ecfdf5',
            mintSoft: '#a7f3d0',
            danger: '#ef4444',
            amberWarn: '#f59e0b',
          }
        }
      }
    };
  </script>

  <style>
    /* =========================================================================
       NATURAL DOCUMENT SCROLLING — NEVER LOCK HTML OR BODY HEIGHT
       ========================================================================= */
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      height: auto;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background-color: #060f0b;
      color: #ecfdf5;
      font-family: 'Cairo', 'Tajawal', 'Segoe UI', Tahoma, Arial, sans-serif;
    }

    /* Centered Mobile-First Shell */
    .app-container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
      background:
        radial-gradient(circle at 50% 0%, rgba(16, 185, 129, 0.12) 0%, transparent 45%),
        #060f0b;
    }

    @media (min-width: 540px) {
      .app-container {
        border-left: 1px solid rgba(16, 185, 129, 0.16);
        border-right: 1px solid rgba(16, 185, 129, 0.16);
        box-shadow: 0 0 70px rgba(16, 185, 129, 0.12);
      }
    }

    /* Generous Bottom Padding so Fixed Bottom Nav Never Covers Content */
    .page-content {
      padding: 16px 16px 124px 16px;
    }

    /* Tactical Card Surface */
    .tactical-card {
      background: linear-gradient(155deg, rgba(18, 41, 31, 0.94), rgba(12, 28, 21, 0.98));
      border: 1px solid rgba(16, 185, 129, 0.24);
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.45);
    }

    .emerald-glow {
      box-shadow: 0 6px 24px rgba(16, 185, 129, 0.34);
    }

    .lime-glow {
      box-shadow: 0 6px 26px rgba(163, 230, 53, 0.28);
    }

    .nav-glass {
      background: rgba(6, 15, 11, 0.96);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid rgba(16, 185, 129, 0.24);
    }

    /* Circular SVG Timer Ring */
    .ring-progress {
      transition: stroke-dashoffset 0.35s linear;
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
    }

    /* Live Pulsing Breathing Guide */
    @keyframes breathePulse {
      0%, 100% {
        transform: scale(1);
        border-color: rgba(16, 185, 129, 0.5);
        background-color: rgba(16, 185, 129, 0.14);
      }
      50% {
        transform: scale(1.03);
        border-color: rgba(163, 230, 53, 0.9);
        background-color: rgba(163, 230, 53, 0.22);
      }
    }
    .breathe-pulse {
      animation: breathePulse 6s ease-in-out infinite;
    }

    /* Smooth Tab Entry */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-up {
      animation: fadeUp 0.22s ease-out;
    }

    /* Scrollable Modals */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(3, 9, 6, 0.88);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 20px 14px 44px 14px;
    }
  </style>
</head>
<body>

  <!-- Non-interactive Confetti Canvas -->
  <canvas id="confettiCanvas" class="fixed inset-0 pointer-events-none z-50 hidden"></canvas>

  <!-- Toast Notification -->
  <div id="toast" class="fixed top-20 left-1/2 -translate-x-1/2 z-[80] hidden max-w-[90vw] px-5 py-3 rounded-2xl bg-bgCardLight border border-limeSpark/70 text-mintText text-sm font-extrabold shadow-2xl text-center"></div>

  <!-- App Container -->
  <div class="app-container">

    <!-- Sticky Top Header -->
    <header class="sticky top-0 z-30 bg-bgDeep/95 backdrop-blur-md border-b border-emeraldPri/20 px-4 py-3">
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2.5 min-w-0">
          <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-limeSpark to-emeraldPri flex items-center justify-center text-bgDeep font-black text-xl emerald-glow shrink-0">
            ⚡
          </div>
          <div class="min-w-0">
            <div class="flex items-center gap-1.5">

              <span id="headerPhaseBadge" class="text-[11px] font-black px-2 py-0.5 rounded-lg bg-emeraldPri/20 border border-emeraldPri/40 text-limeSpark">المرحلة 1</span>

          <div class="px-2.5 py-1.5 rounded-xl bg-bgCard border border-emeraldPri/25 flex items-center gap-1">

        </div>
      </div>
    </header>

    <!-- Main Natural-Flow Scrollable Content -->
    <main id="appMain" class="page-content"></main>

    <!-- Fixed 4-Tab Bottom Navigation Bar (No Settings Tab) -->

      <div class="grid grid-cols-4 px-2 py-2 gap-1">
        <button onclick="switchTab('home')" data-tab="home" class="nav-btn flex flex-col items-center justify-center py-2 rounded-2xl transition gap-0.5">
          <span class="text-lg leading-none">🏠</span>
          <span class="text-xs font-extrabold">الرئيسية</span>
        </button>
        <button onclick="switchTab('workout')" data-tab="workout" class="nav-btn flex flex-col items-center justify-center py-2 rounded-2xl transition gap-0.5">
          <span class="text-lg leading-none">🔥</span>
          <span class="text-xs font-extrabold">التمرين</span>
        </button>
        <button onclick="switchTab('plan')" data-tab="plan" class="nav-btn flex flex-col items-center justify-center py-2 rounded-2xl transition gap-0.5">
          <span class="text-lg leading-none">📋</span>
          <span class="text-xs font-extrabold">الجدول</span>
        </button>
        <button onclick="switchTab('progress')" data-tab="progress" class="nav-btn flex flex-col items-center justify-center py-2 rounded-2xl transition gap-0.5">
          <span class="text-lg leading-none">🏆</span>
          <span class="text-xs font-extrabold">تقدمي</span>

  <!-- ==================== MODALS ==================== -->

    <div class="max-w-md mx-auto tactical-card rounded-3xl p-5 space-y-5 border-limeSpark/50 my-4">

        </div>
        <h2 class="text-xl font-black text-mintText">يا صقر.. متفكرش في التمرين كله!</h2>

          إغلاق
        </button>
      </div>
    </div>
  </div>

    function defaultState() {
      return {
        totalWorkouts: 0,
        xp: 0,
        streak: 0,

        completedDates: [],
        badges: [],

          pushups: { best: 0, prev: 0 },
          wallsit: { best: 0, prev: 0 },
          plank:   { best: 0, prev: 0 }
        }
      };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return defaultState();
        const parsed = JSON.parse(raw);
        const def = defaultState();
        return {
          ...def,
          ...parsed,
          prs: { ...def.prs, ...(parsed.prs || {}) },
          completedDates: Array.isArray(parsed.completedDates) ? parsed.completedDates : [],
          badges: Array.isArray(parsed.badges) ? parsed.badges : [],
          history: Array.isArray(parsed.history) ? parsed.history : [],
          daily: parsed.daily || {}
        };
      } catch (e) {
        return defaultState();
      }
    }

    let appState = loadState();
    let activeTab = 'home';

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      } catch (e) {
        showToast('تعذر حفظ البيانات في المتصفح');
      }
      updateHeader();
    }

    function getDateKey(dateObj = new Date()) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function getTodayDaily() {
      const k = getDateKey();
      if (!appState.daily[k]) {
        appState.daily[k] = { water: 0, waterXp: false, sleepDone: false };
      }
      return appState.daily[k];
    }

    function getNextWorkoutDayName(todayJsDay) {
      const names = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
      for (let i = 1; i <= 7; i++) {
        const d = (todayJsDay + i) % 7;
        if (WORKOUT_JS_DAYS.includes(d)) return names[d];
      }
      return 'الأحد';
    }

    function getRank() {
      let curr = RANKS[0];
      let next = RANKS[1];
      for (let i = 0; i < RANKS.length; i++) {
        if (appState.xp >= RANKS[i].minXP) {
          curr = RANKS[i];
          next = RANKS[i + 1] || null;
        }
      }
      return { curr, next };
    }

    function unlockBadge(id) {
      if (!appState.badges.includes(id)) {
        appState.badges.push(id);
        return true;
      }
      return false;
    }

    function getWorkoutsLast7Days() {
      const cutoff = new Date();
      cutoff.setDate(cutoff.getDate() - 6);
      cutoff.setHours(0, 0, 0, 0);
      return appState.history.filter(h => new Date(h.iso) >= cutoff).length;
    }

    // --- WEB AUDIO API + HAPTIC VIBRATION ---
    let audioCtx = null;
    function getAudioCtx() {
      try {
        if (!audioCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) audioCtx = new AC();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume().catch(() => {});
        }
        return audioCtx;
      } catch (e) {
        return null;
      }
    }

    function playTone(freq = 520, dur = 0.12, type = 'sine', vol = 0.22) {
      try {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(vol, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + dur);
      } catch (e) {}
    }

    function buzz(pattern) {
      try {
        if (navigator.vibrate) navigator.vibrate(pattern);
      } catch (e) {}
    }

    const SFX = {
      tick: () => { playTone(560, 0.08, 'sine', 0.15); buzz(20); },
      start: () => { playTone(880, 0.22, 'triangle', 0.24); buzz([50, 30, 70]); },
      done: () => {
        playTone(660, 0.12, 'triangle', 0.22);
        setTimeout(() => playTone(990, 0.22, 'triangle', 0.24), 130);
        buzz([70, 40, 110]);
      },
      restOver: () => {
        playTone(740, 0.14, 'sine', 0.22);
        setTimeout(() => playTone(988, 0.26, 'triangle', 0.26), 150);
        buzz([100, 50, 100]);
      },
      victory: () => {
        [523, 659, 784, 1046].forEach((f, idx) => setTimeout(() => playTone(f, 0.22, 'triangle', 0.25), idx * 130));
        buzz([100, 50, 100, 50, 220]);

    function updateSparkUI() {
      const m = String(Math.floor(sparkSec / 60)).padStart(2, '0');
      const s = String(sparkSec % 60).padStart(2, '0');
      document.getElementById('sparkTimerClock').textContent = `${m}:${s}`;
      const hint = document.getElementById('sparkStepHint');
      if (sparkSec > 40) hint.textContent = '1️⃣ قوم اقف على رجلك دلوقتي وسيب الموبايل من إيدك ثانية!';
      else if (sparkSec > 20) hint.textContent = '2️⃣ لف كتافك لورا 10 مرات بالراحة!';
      else if (sparkSec > 0) hint.textContent = '3️⃣ خد 3 أنفاس عميقة.. كده الكسل مات!';
      else hint.textContent = '🔥 عاش يا صقر! دوس الزرار الأخضر وابدأ التسخين فوراً!';
    }

    function toggleSparkTimer() {
      const btn = document.getElementById('sparkStartBtn');
      if (sparkInt) {
        clearInterval(sparkInt);
        sparkInt = null;
        btn.textContent = 'كمّل العداد ⚡';
        return;
      }
      if (sparkSec <= 0) sparkSec = 60;
      SFX.start();
      btn.textContent = 'إيقاف مؤقت ⏸';
      sparkInt = setInterval(() => {
        sparkSec--;
        if (sparkSec <= 3 && sparkSec > 0) SFX.tick();
        updateSparkUI();
        if (sparkSec <= 0) {
          clearInterval(sparkInt);
          sparkInt = null;

    function toggleHoldTimer() {

        renderCurrentTab();
        return;

      session.holdRunning = true;
      session.breatheIn = true;
      SFX.start();
      renderCurrentTab();

      // Breathing Guide toggles every 3 seconds
      breatheTimer = setInterval(() => {
        session.breatheIn = !session.breatheIn;
        const t = document.getElementById('breatheText');
        if (t) {
          t.textContent = session.breatheIn
            ? 'شهيق بهدوء 3 ثواني... 🫁'
            : 'زفير منتظم... متحبسش نفسك! 🌬️';
        }
      }, 3000);

      activeInterval = setInterval(() => {
        session.holdRem--;
        session.holdSecEarned++;
        if (session.holdRem <= 3 && session.holdRem > 0) SFX.tick();
        if (session.holdRem <= 0) {
          pauseAllWorkoutTimers();
          SFX.done();
          finishSet(false);
        } else {
          const num = document.getElementById('holdNum');
          const ring = document.getElementById('holdRing');
          if (num) num.textContent = session.holdRem;
          if (ring) {
            const c = 2 * Math.PI * 64;
            ring.style.strokeDashoffset = c * (1 - (session.holdRem / session.holdTotal));
          }
        }
      }, 1000);
    }

    function finishSet(manualTap) {
      pauseAllWorkoutTimers();
      const ex = session.exercises[session.exIdx];
      if (manualTap && ex.type === 'hold' && session.holdRem === session.holdTotal) {
        session.holdSecEarned += session.holdTotal;
      }
      session.setsDone++;
      SFX.done();

      const isLastSet = session.setNum >= ex.sets;
      const isLastEx = session.exIdx >= session.exercises.length - 1;

      if (isLastSet && isLastEx) {
        startCooldown();
        return;
      }

      if (isLastSet) {
        session.exIdx++;
        session.setNum = 1;
        syncCurrentExercise();
      } else {
        session.setNum++;
        session.holdRem = session.holdTotal;
      }

      startAutoRest();
    }

    // --- AUTOMATIC 75s REST TIMER ---
    function startAutoRest() {
      pauseAllWorkoutTimers();
      session.phase = 'rest';
      session.restTotal = REST_DEFAULT;
      session.restRem = REST_DEFAULT;
      renderCurrentTab();

      activeInterval = setInterval(() => {
        session.restRem--;
        if (session.restRem <= 3 && session.restRem > 0) SFX.tick();
        if (session.restRem <= 0) {
          SFX.restOver();
          endAutoRest();
        } else {
          const clk = document.getElementById('restClock');
          const bar = document.getElementById('restBar');
          if (clk) clk.textContent = `${String(Math.floor(session.restRem / 60)).padStart(2, '0')}:${String(session.restRem % 60).padStart(2, '0')}`;
          if (bar) bar.style.width = `${Math.max(0, Math.round((session.restRem / session.restTotal) * 100))}%`;
        }
      }, 1000);
    }

      session.restRem += 15;

    function startCooldown() {

    function toggleCooldownTimer() {

        renderCurrentTab();

        finishWorkoutSession();

    // --- CELEBRATION & COMPLETION ---
    function finishWorkoutSession() {
      pauseAllWorkoutTimers();
      const prevPhase = getPhaseInfo(appState.totalWorkouts).num;
      const durMin = Math.max(1, Math.round((Date.now() - (session.startedAt || Date.now())) / 60000));
      const todayKey = getDateKey();

      if (appState.lastWorkoutDate !== todayKey) {
        appState.streak += 1;
      }
      appState.lastWorkoutDate = todayKey;
      if (!appState.completedDates.includes(todayKey)) {
        appState.completedDates.push(todayKey);
      }

      appState.totalWorkouts += 1;
      appState.totalHoldSec += session.holdSecEarned;
      appState.xp += 100;

      const newPhase = getPhaseInfo(appState.totalWorkouts).num;
      const leveledUpPhase = newPhase > prevPhase;

      appState.history.unshift({
        dateStr: new Date().toLocaleDateString('ar-EG', { weekday: 'short', day: 'numeric', month: 'short' }),
        iso: new Date().toISOString(),
        phase: session.phaseNum,
        durMin,
        setsDone: session.setsDone,
        holdSec: session.holdSecEarned,
        xpEarned: 100
      });

      const newBadges = [];
      if (appState.totalWorkouts >= 1 && unlockBadge('first_workout')) newBadges.push('🥇 أول تمرينة');
      if (getWorkoutsLast7Days() >= 3 && unlockBadge('three_week')) newBadges.push('🔥 أسبوع كامل');
      if (appState.totalHoldSec >= 300 && unlockBadge('nerves_300')) newBadges.push('⚡ أعصاب فولاذ');
      if (appState.totalWorkouts >= 12 && unlockBadge('phase2_unlock')) newBadges.push('🛡️ بطل المرحلة 1');
      if (appState.totalWorkouts >= 24 && unlockBadge('phase3_unlock')) newBadges.push('👑 المستوى الفولاذي');

      saveState();
      session.phase = 'complete';
      session.summary = { durMin, newBadges, leveledUpPhase, newPhase };
      SFX.victory();
      fireConfetti();
      renderCurrentTab();
    }

              <h3 class="text-sm font-black text-limeSpark">🔥 أولاً: التسخين الحركي (5 دقائق)</h3>
              <a href="${WARMUP_YT}" target="_blank" rel="noopener noreferrer"
                class="px-3 py-1.5 rounded-xl bg-red-600/20 border border-red-500/45 text-red-200 text-[11px] font-black">
                ▶ فيديو يوتيوب
              </a>
            </div>
            <ul class="text-xs text-mintText space-y-1.5 list-disc list-inside leading-relaxed">
              <li><strong>دقيقة 1:</strong> مشي سريع أو جري خفيف في مكانك.</li>
              <li><strong>دقيقتين:</strong> تليين المفاصل (رقبة، كتاف، رسغ، وسط، ركب، كاحل).</li>
              <li><strong>دقيقتين:</strong> 5 عدات نص سكوات خفيف + مرجحة الدراعين.</li>
            </ul>
          </div>

          <!-- 7 Locked-in Exercises -->
          <div class="space-y-3.5">
            <h3 class="text-sm font-black text-mintText px-1">💪 ثانياً: الـ 7 تمارين الأساسية (الراحة بين كل مجموعة 75 ثانية)</h3>
            ${list.map((ex, idx) => `
              <div class="tactical-card rounded-3xl p-4 space-y-3">
                <div class="flex items-start justify-between gap-2">
                  <div class="flex items-center gap-2.5">
                    <span class="w-8 h-8 rounded-xl bg-emeraldPri text-bgDeep font-black text-sm flex items-center justify-center shrink-0">${idx + 1}</span>
                    <div>
                      <h4 class="text-sm font-black text-mintText leading-snug">${ex.name}</h4>
                      <p class="text-[11px] font-bold text-emeraldBright">${ex.muscles}</p>
                    </div>
                  </div>
                  <span class="shrink-0 px-2.5 py-1 rounded-xl bg-bgDeep border border-emeraldPri/35 text-limeSpark text-[11px] font-black">
                    ${ex.sets} × ${ex.target}
                  </span>
                </div>

                <div class="rounded-2xl overflow-hidden border border-emeraldPri/25">
                  ${getExerciseSVG(ex.svgKey)}
                </div>

                <p class="text-xs text-mintText/95 bg-bgDeep/80 rounded-2xl p-3 border border-emeraldPri/15 leading-relaxed">
                  <strong class="text-limeSpark">الطريقة الصح:</strong> ${ex.cue}
                </p>

                <a href="${ex.yt}" target="_blank" rel="noopener noreferrer"
                  class="flex items-center justify-center gap-2 w-full py-3 rounded-2xl bg-red-600/20 border border-red-500/40 text-red-200 font-black text-xs active:scale-95 transition">
                  <span>▶</span>
                  <span>شاهد شرح التمرين على يوتيوب</span>
                </a>
              </div>
            `).join('')}
          </div>

          <!-- Cool-down Card -->
          <div class="tactical-card rounded-3xl p-4 space-y-2 border-emeraldPri/35">
            <h3 class="text-sm font-black text-limeSpark">🧘 ثالثاً: التهدئة والإطالة (3 دقائق بعد التمرين)</h3>
            <div class="grid grid-cols-2 gap-2 text-xs text-mintSoft">
              <div class="bg-bgDeep/80 rounded-xl p-2.5 border border-emeraldPri/15">1. وضع الطفل (45 ث)</div>
              <div class="bg-bgDeep/80 rounded-xl p-2.5 border border-emeraldPri/15">2. إطالة الصدر بالباب (45 ث)</div>
              <div class="bg-bgDeep/80 rounded-xl p-2.5 border border-emeraldPri/15">3. إطالة الفخد واقف (45 ث)</div>
              <div class="bg-bgDeep/80 rounded-xl p-2.5 border border-emeraldPri/15">4. تنفس عميق (45 ث)</div>
            </div>
          </div>

          <!-- Automatic 3-Phase Roadmap -->
          <div class="tactical-card rounded-3xl p-4 space-y-3">
            <h3 class="text-sm font-black text-mintText">🗺️ خريطة تطورك الأوتوماتيك (3 مراحل)</h3>
            <div class="space-y-2 text-xs">
              <div class="p-3 rounded-2xl border ${pInfo.num === 1 ? 'bg-emeraldPri/20 border-limeSpark/70' : 'bg-bgDeep/75 border-emeraldPri/20'}">
                <div class="font-black ${pInfo.num === 1 ? 'text-limeSpark' : 'text-emeraldBright'}">
                  ${appState.totalWorkouts >= 12 ? '✅' : '🟢'} المرحلة 1 — التأسيس (تمرينة 1 لـ 12)
                </div>
                <p class="text-mintSoft/85 mt-1">ضغط مائل على سرير، ثبات 20–25 ثانية، سمانة برجلينك، بلانك على الركب.</p>
              </div>
              <div class="p-3 rounded-2xl border ${pInfo.num === 2 ? 'bg-emeraldPri/20 border-limeSpark/70' : 'bg-bgDeep/75 border-white/10 opacity-85'}">
                <div class="font-black ${pInfo.num === 2 ? 'text-limeSpark' : 'text-mintText'}">
                  ${appState.totalWorkouts >= 24 ? '✅' : (appState.totalWorkouts >= 12 ? '🟢' : '🔒')} المرحلة 2 — زيادة القوة (تمرينة 13 لـ 24)
                </div>
                <p class="text-mintSoft/80 mt-1">بتتفتح أوتوماتيك بعد 12 تمرينة: ضغط سطح أوطى، ثبات 35 ثانية، سمانة برجل واحدة، بلانك كامل.</p>
              </div>
              <div class="p-3 rounded-2xl border ${pInfo.num === 3 ? 'bg-emeraldPri/20 border-limeSpark/70' : 'bg-bgDeep/75 border-white/10 opacity-85'}">
                <div class="font-black ${pInfo.num === 3 ? 'text-limeSpark' : 'text-mintText'}">
                  ${appState.totalWorkouts >= 24 ? '🟢' : '🔒'} المرحلة 3 — المستوى الفولاذي (من تمرينة 25)
                </div>
                <p class="text-mintSoft/80 mt-1">بتتفتح أوتوماتيك بعد 24 تمرينة: ضغط عميق على كتب / برفع الرجلين، سحب فوطة انفجاري 5 ثواني، ثبات 45 ثانية.</p>
              </div>
            </div>
          </div>

          <!-- 4 Forbidden Exercises for Phase 1 -->
          <div class="tactical-card rounded-3xl p-4 space-y-2.5 border-danger/50 bg-danger/10">
            <h3 class="text-sm font-black text-red-200">🚫 4 تمارين ممنوع تعملهم دلوقتي عشان متتصابش</h3>
            <div class="space-y-2 text-xs text-red-100 leading-relaxed">
              <div class="bg-bgDeep/80 rounded-xl p-2.5 border border-danger/30"><strong class="text-amberWarn">1. المتوازي (Dips):</strong> تقيل جداً على الكتف قبل ما تتأسس.</div>
              <div class="bg-bgDeep/80 rounded-xl p-2.5 border border-danger/30"><strong class="text-amberWarn">2. الوقوف على اليدين (Handstand):</strong> حمل خطر على الرسغ والكتف والرقبة دلوقتي.</div>
              <div class="bg-bgDeep/80 rounded-xl p-2.5 border border-danger/30"><strong class="text-amberWarn">3. الـ L-Sit بين كرسيين:</strong> صعب جداً وكراسي البيت ممكن تتزحلق بيك.</div>
              <div class="bg-bgDeep/80 rounded-xl p-2.5 border border-danger/30"><strong class="text-amberWarn">4. القفز من سلمة (Drop Jumps):</strong> صدمة عالية على الركبة قبل ما رجلك تنشف.</div>
            </div>
          </div>
        </div>
      `;
    }

    /* =========================================================================
       TAB 4: PROGRESS (تقدمي + اختبارات قوتك + الأوسمة + سجل التمارين)
       ========================================================================= */
    function renderProgress(el) {
      const pInfo = getPhaseInfo(appState.totalWorkouts);
      const { curr, next } = getRank();
      const xpPct = next ? Math.min(100, Math.round(((appState.xp - curr.minXP) / (next.minXP - curr.minXP)) * 100)) : 100;

      const prMeta = [
        { key: 'pushups', icon: '💪', label: 'أقصى ضغط متواصل', unit: 'عدة', ph: 'مثلاً 10' },
        { key: 'wallsit', icon: '🧱', label: 'أطول ثبات على الحيط', unit: 'ثانية', ph: 'مثلاً 40' },
        { key: 'plank',   icon: '⚡', label: 'أطول ثبات بلانك', unit: 'ثانية', ph: 'مثلاً 35' }
      ];

      el.innerHTML = `
        <div class="space-y-4">
          <div>
            <h2 class="text-xl font-black text-mintText">تقدمك وأرقامك يا صقر 🏆</h2>
            <p class="text-xs font-bold text-mintSoft/80">كل تمرينة بتقربك خطوة لجسم قوي وأعصاب فولاذ</p>
          </div>

          <!-- Top 4 Stats -->
          <div class="grid grid-cols-2 gap-2.5">
            <div class="tactical-card rounded-2xl p-3.5 text-center">
              <div class="text-2xl font-black text-limeSpark">${appState.totalWorkouts}</div>
              <div class="text-[11px] font-bold text-mintSoft/80 mt-0.5">إجمالي التمارين</div>
            </div>
            <div class="tactical-card rounded-2xl p-3.5 text-center">
              <div class="text-2xl font-black text-emeraldBright">${pInfo.inPhaseDone} / ${pInfo.phaseGoal}</div>
              <div class="text-[11px] font-bold text-mintSoft/80 mt-0.5">تقدم المرحلة ${pInfo.num}</div>
            </div>
            <div class="tactical-card rounded-2xl p-3.5 text-center">
              <div class="text-2xl font-black text-mintText">${appState.streak} 🔥</div>
              <div class="text-[11px] font-bold text-mintSoft/80 mt-0.5">سلسلة الالتزام</div>
            </div>
            <div class="tactical-card rounded-2xl p-3.5 text-center">
              <div class="text-2xl font-black text-limeSpark">${appState.xp} XP</div>
              <div class="text-[11px] font-bold text-mintSoft/80 mt-0.5">${curr.icon} ${curr.title}</div>
            </div>
          </div>

          <!-- Rank Progress -->
          <div class="tactical-card rounded-3xl p-4 space-y-2">
            <div class="flex items-center justify-between text-xs font-black">
              <span class="text-mintText">المستوى ${curr.level}: ${curr.title} ${curr.icon}</span>
              <span class="text-limeSpark">${next ? `التالي: ${next.title} (${next.minXP} XP)` : 'أعلى رتبة 🦅'}</span>
            </div>
            <div class="w-full h-2.5 bg-bgDeep rounded-full overflow-hidden border border-emeraldPri/25">
              <div class="h-full bg-gradient-to-l from-limeSpark to-emeraldPri rounded-full transition-all" style="width:${xpPct}%"></div>
            </div>
          </div>

          <!-- Strength PR Tracker ("اختبارات قوتك") -->
          <div class="tactical-card rounded-3xl p-4 space-y-3">
            <div>
              <h3 class="text-sm font-black text-limeSpark">اختبارات قوتك (سجّل أرقامك كل أسبوعين) 💪</h3>
              <p class="text-[11px] text-mintSoft/75">اختبر نفسك وشوف قوتك بتزيد قد إيه بالأرقام</p>
            </div>
            <div class="space-y-2.5">
              ${prMeta.map(item => {
                const rec = appState.prs[item.key] || { best: 0, prev: 0 };
                const gain = rec.best > 0 && rec.prev > 0 ? rec.best - rec.prev : 0;
                return `
                  <div class="bg-bgDeep/80 rounded-2xl p-3 border border-emeraldPri/20 space-y-2">
                    <div class="flex items-center justify-between text-xs">
                      <span class="font-black text-mintText">${item.icon} ${item.label}</span>
                      <span class="font-black text-limeSpark">
                        ${rec.best > 0 ? `${rec.best} ${item.unit}` : 'لسه متسجلش'}
                        ${gain > 0 ? `<span class="text-emeraldBright text-[10px] mr-1">(+${gain} ↑)</span>` : ''}
                      </span>
                    </div>
                    <div class="flex gap-2">
                      <input id="pr_${item.key}" type="number" min="1" placeholder="${item.ph}"
                        class="flex-1 px-3 py-2 rounded-xl bg-bgCard border border-emeraldPri/30 text-xs font-bold text-mintText outline-none focus:border-limeSpark"/>
                      <button onclick="recordPR('${item.key}', '${item.unit}')" class="px-4 py-2 rounded-xl bg-emeraldPri text-bgDeep font-black text-xs active:scale-95">
                        سجّل ✓
                      </button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <!-- Badges -->
          <div class="tactical-card rounded-3xl p-4 space-y-3">
            <div class="flex items-center justify-between">
              <h3 class="text-sm font-black text-mintText">الأوسمة 🏅</h3>
              <span class="text-xs font-black text-limeSpark">${appState.badges.length} / ${BADGES.length}</span>
            </div>
            <div class="grid grid-cols-2 gap-2.5">
              ${BADGES.map(b => {
                const on = appState.badges.includes(b.id);
                return `
                  <div class="rounded-2xl p-3 border text-center space-y-1 ${
                    on ? 'bg-emeraldPri/20 border-limeSpark/50 emerald-glow' : 'bg-bgDeep/75 border-white/5 opacity-55'
                  }">
                    <div class="text-2xl ${on ? '' : 'grayscale'}">${b.icon}</div>
                    <div class="text-xs font-black ${on ? 'text-limeSpark' : 'text-gray-300'}">${b.title}</div>
                    <div class="text-[10px] text-gray-400 leading-snug">${b.desc}</div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <!-- Workout History Log -->
          <div class="tactical-card rounded-3xl p-4 space-y-2.5">
            <h3 class="text-sm font-black text-mintText">سجل التمارين السابقة 📆</h3>
            ${appState.history.length === 0 ? `
              <p class="text-xs text-gray-400 text-center py-4">لسه مفيش تمارين متسجلة.. ابدأ أول تمرينة النهارده! 🦅</p>
            ` : `
              <div class="space-y-2">
                ${appState.history.slice(0, 15).map(h => `
                  <div class="bg-bgDeep/80 rounded-2xl p-3 border border-emeraldPri/15 flex items-center justify-between text-xs">
                    <div>
                      <div class="font-black text-mintText">${h.dateStr} • المرحلة ${h.phase}</div>
                      <div class="text-[11px] text-gray-400">${h.durMin} دقيقة • ${h.setsDone} مجموعة • ${h.holdSec}ث ثبات</div>
                    </div>
                    <span class="px-2.5 py-1 rounded-xl bg-emeraldPri/20 text-limeSpark font-black">+${h.xpEarned} XP</span>
                  </div>
                `).join('')}
              </div>
            `}
          </div>

          <!-- Safe Reset Button at Very Bottom -->
          <div class="pt-2">
            <button onclick="askResetProgress()" class="w-full py-3 rounded-2xl bg-danger/15 border border-danger/35 text-red-300 text-xs font-black active:scale-95 transition">
              مسح التقدم والبدء من الصفر 🗑️
            </button>
          </div>
        </div>
      `;
    }

    function recordPR(key, unit) {
      const inp = document.getElementById(`pr_${key}`);
      const val = parseInt(inp.value, 10);
      if (isNaN(val) || val <= 0) {
        showToast('اكتب رقم صحيح الأول');
        return;
      }
      const rec = appState.prs[key] || { best: 0, prev: 0 };
      if (val > rec.best) {
        rec.prev = rec.best;
        rec.best = val;
        appState.prs[key] = rec;
        appState.xp += 20;
        SFX.done();
        showToast(`رقم قياسي جديد: ${val} ${unit}! (+20 XP) 🔥`);
      } else {
        showToast(`أفضل رقمك الحالي هو ${rec.best} ${unit}.. المرة الجاية تكسره! 💪`);
      }
      saveState();
      renderCurrentTab();
    }

    function askResetProgress() {
      openConfirmModal(
        'تأكيد مسح كل التقدم ⚠️',
        'هتتمسح كل التمارين والأرقام القياسية والـ XP وتبدأ المرحلة 1 من أول تمرينة. متأكد؟',
        `
          <button onclick="confirmResetProgress()" class="flex-1 py-3 rounded-xl bg-danger text-white font-black text-sm">أيوة، ابدأ من الصفر</button>
          <button onclick="closeConfirmModal()" class="flex-1 py-3 rounded-xl bg-bgCardLight text-mintText font-bold text-sm">إلغاء</button>
        `
      );
    }

    function confirmResetProgress() {
      appState = defaultState();
      saveState();
      closeConfirmModal();
      switchTab('home');
      showToast('تم تصفير التقدم.. بداية قوية يا صقر! 🦅');
    }

    // --- CONFETTI CELEBRATION ---
    function fireConfetti() {
      const canvas = document.getElementById('confettiCanvas');
      canvas.classList.remove('hidden');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const palette = ['#10b981', '#34d399', '#a3e635', '#ecfdf5', '#a7f3d0'];
      const items = Array.from({ length: 85 }, () => ({
        x: Math.random() * canvas.width,
        y: -20 - Math.random() * 140,
        w: 6 + Math.random() * 6,
        h: 4 + Math.random() * 5,
        vy: 3 + Math.random() * 4.5,
        vx: (Math.random() - 0.5) * 4,
        rot: Math.random() * Math.PI * 2,
        vr: (Math.random() - 0.5) * 0.2,
        c: palette[Math.floor(Math.random() * palette.length)]
      }));

      let frame = 0;
      function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        items.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.rot += p.vr;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = p.c;
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          ctx.restore();
        });
        frame++;
        if (frame < 135) {
          requestAnimationFrame(loop);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          canvas.classList.add('hidden');
        }
      }
      requestAnimationFrame(loop);
    }

    // --- INITIALIZE ON LOAD ---
    window.onload = function () {
      updateHeader();
      switchTab('home');
    };
  </script>
</body>
</html>
